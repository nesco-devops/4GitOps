apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: appgestion
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/nesco-devops/4GitOps.git
    targetRevision: main
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: appgestion

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
