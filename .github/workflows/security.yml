name: GitOps Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Vérifier les secrets et Kubernetes
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer les manifests
        uses: actions/checkout@v4
      - name: Valider les manifests avec Kustomize
        shell: bash
        run: |
          set -euo pipefail
          kubectl version --client
          kubectl kustomize . > /dev/null
          echo "Validation Kustomize réussie."

      - name: Rechercher les secrets avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: .git

      - name: Vérifier les configurations Kubernetes avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: .git
